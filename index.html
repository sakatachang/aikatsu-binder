<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fff7fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="アイカツバインダー" />
  <title>アイカツ バインダー</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 id="pageTitle">バインダー</h1>
    </header>

    <main>
      <section id="binderPage" class="page active" aria-label="バインダー">
        <div class="binder-tools">
          <div class="search-row">
            <label class="searchbox">
              <span>⌕</span>
              <input id="searchInput" type="search" placeholder="カード名・番号で検索" autocomplete="off" />
            </label>
            <button id="filterButton" class="pink-button small">絞り込み</button>
          </div>
          <div id="activeFilters" class="filter-chips" aria-live="polite"></div>
          <div class="result-line"><span id="resultCount">0枚</span><span>シリーズ順</span></div>
        </div>
        <div id="cardGrid" class="card-grid" aria-live="polite"></div>
        <div id="emptyCards" class="empty-state hidden">条件に合うカードがありません。</div>
      </section>

      <section id="selectedPage" class="page" aria-label="選択中">
        <div class="page-note">選択中のコーデ</div>
        <div id="selectedSlots" class="selected-list"></div>
        <button id="saveOutfitButton" class="wide-primary">♡ お気に入りコーデ登録</button>
        <p id="outfitLimitText" class="sub-note"></p>
      </section>

      <section id="qrPage" class="page qr-page" aria-label="QR表示">
        <div class="qr-note">カード種類ごとに位置を固定しています。<br><small>iPhoneの画面明るさは手動で上げてください。表示中は可能な範囲でスリープを防止します。</small></div>
        <div class="qr-grid">
          <div class="qr-slot" data-qrslot="tops"><div class="qr-label">トップス</div><div class="qr-box"></div><div class="qr-cardno"></div></div>
          <div class="qr-slot" data-qrslot="bottoms"><div class="qr-label">ボトムス</div><div class="qr-box"></div><div class="qr-cardno"></div></div>
          <div class="qr-slot" data-qrslot="shoes"><div class="qr-label">シューズ</div><div class="qr-box"></div><div class="qr-cardno"></div></div>
          <div class="qr-slot" data-qrslot="accessory"><div class="qr-label">アクセ</div><div class="qr-box"></div><div class="qr-cardno"></div></div>
        </div>
      </section>

      <section id="settingsPage" class="page" aria-label="設定">
        <div class="settings-card">
          <button class="settings-row" id="openOutfitsButton"><span>♡ お気に入りコーデ</span><span>›</span></button>
          <button class="settings-row" id="reloadDataButton"><span>↻ カードデータ再読み込み</span><span>›</span></button>
          <button class="settings-row" id="exportButton"><span>⇩ バックアップを書き出す</span><span>›</span></button>
          <label class="settings-row file-row"><span>⇧ バックアップを読み込む</span><input id="importInput" type="file" accept="application/json,.json" /></label>
        </div>
        <div class="settings-card info-card">
          <div><b>保存方法</b><br>お気に入り・選択中カード・コーデはこのブラウザ内だけに保存されます。</div>
          <div id="dataInfo"></div>
        </div>
      </section>

      <section id="outfitsPage" class="page" aria-label="お気に入りコーデ">
        <div class="subpage-head"><button id="backSettingsButton" class="text-button">‹ 設定</button></div>
        <div id="outfitList" class="outfit-list"></div>
        <div id="emptyOutfits" class="empty-state hidden">お気に入りコーデはまだありません。</div>
      </section>
    </main>

    <div id="selectedMiniBar" class="selected-mini-bar hidden">
      <div class="mini-left"><span class="mini-title">選択中</span><span id="miniCount" class="mini-count">0枚</span></div>
      <div id="miniCards" class="mini-cards"></div>
      <button id="miniGoSelected" class="mini-arrow" aria-label="選択中画面へ">›</button>
    </div>

    <nav class="bottom-nav" aria-label="メインメニュー">
      <button class="nav-button active" data-page="binder"><span class="nav-icon">▦</span><span>バインダー</span></button>
      <button class="nav-button" data-page="selected"><span class="nav-icon">♧</span><span>選択中</span></button>
      <button class="nav-button" data-page="qr"><span class="nav-icon">▣</span><span>QR</span></button>
      <button class="nav-button" data-page="settings"><span class="nav-icon">⚙</span><span>設定</span></button>
    </nav>
  </div>

  <div id="filterSheet" class="sheet-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row"><h2 id="filterTitle">絞り込み</h2><button id="closeFilter" class="icon-button">×</button></div>
      <div id="filterGroups" class="filter-groups"></div>
      <div class="sheet-actions"><button id="resetFilters" class="secondary-button">リセット</button><button id="applyFilters" class="wide-primary compact">この条件で表示</button></div>
    </div>
  </div>

  <div id="detailModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <img id="detailImage" alt="カード画像" />
      <h2 id="detailName"></h2>
      <p id="detailBrand"></p>
      <button id="closeDetail" class="wide-primary compact">閉じる</button>
    </div>
  </div>

  <div id="toast" class="toast hidden" aria-live="polite"></div>
</body>
</html>
